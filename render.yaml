services:
  - type: web
    name: forge-imobiliaria
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forge-imobiliaria-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"

databases:
  - name: forge-imobiliaria-db
    databaseName: forge_imobiliaria_production
    plan: free
    ipAllowList: []
